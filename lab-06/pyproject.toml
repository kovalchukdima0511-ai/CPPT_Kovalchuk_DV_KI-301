[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kzp-lab06"
version = "1.5.0"
description = "Lab 06: CSV data processing in Python. Variant 12 - plant nursery"
authors = [{ name = "Kovalchuk Dmytro, KI-301" }]
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "build>=1.2",
]

[project.scripts]
kzp-lab06 = "kzp_lab06.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["build", "dist", ".venv", ".venv-*"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
